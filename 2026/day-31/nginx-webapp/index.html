<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      color: #333;
      text-align: center;
      margin: 0;
      padding: 0;
    }
    h1 {
      background-color: #007acc;
      color: white;
      padding: 20px;
      margin: 0;
    }
    p {
      font-size: 1.2em;
      margin: 20px;
    }
    .docker-note {
      /* Dark Gradient Background */
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #ffffff;
      padding: 25px;
      margin: 30px auto;
      max-width: 600px;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
    }
    .docker-note h2 {
      margin-top: 0;
      color: #64ffda; /* Accent color for title */
    }
  </style>
</head>
<body>
  <h1>Welcome to My Webpage</h1>
  <p>This is a simple index.html file with a touch of style.</p>

  <div class="docker-note">
    <h2>About Docker</h2>
    <p>Docker is a powerful platform that allows developers to build, ship, and run applications inside containers.
    Containers are lightweight, portable, and ensure consistency across different environments.</p>
  </div>
</body>
</html>
